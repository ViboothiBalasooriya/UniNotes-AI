name: uninotes_ai
description: "UniNotes AI – Course-Integrated Academic Resource Sharing Platform with Embedded AI Study Assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2
  google_sign_in: ^6.2.1

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.3.0

  # PDF Viewer
  syncfusion_flutter_pdfviewer: ^27.1.48

  # File Picking
  file_picker: ^8.1.2

  # Networking
  http: ^1.2.2

  # UI & Fonts
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.3
  cached_network_image: ^3.4.1
  lottie: ^3.1.2
  shimmer: ^3.0.0

  # Utilities
  flutter_dotenv: ^5.2.1
  intl: ^0.19.0
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - .env
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
